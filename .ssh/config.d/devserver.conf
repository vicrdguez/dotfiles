# Shared macOS devserver routing. Keep each client's IdentityFile in local config.
# Requires its previously verified Ed25519 host key under 100.103.159.2.
Host devserver
    HostName 100.103.159.2
    ProxyCommand ~/.local/bin/devserver-ssh-connect

Host devserver-lan
    HostName 192.168.1.159
    ProxyCommand none

Host devserver-ts
    HostName 100.103.159.2
    ProxyCommand none

Host devserver devserver-lan devserver-ts
    User vr-osxs
    Port 22
    IdentitiesOnly yes
    AddKeysToAgent yes
    UseKeychain yes
    ForwardAgent no
    ProxyJump none
    HostKeyAlias 100.103.159.2
    HostKeyAlgorithms ssh-ed25519
    StrictHostKeyChecking yes
    CheckHostIP no
    ConnectTimeout 10
    ServerAliveInterval 30
    ServerAliveCountMax 3
