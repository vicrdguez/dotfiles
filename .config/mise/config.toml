[settings]
dotfiles.root = "~/.dotfiles"

[bootstrap.packages]
"brew:fish" = "latest"
"brew:markdown-oxide" = "latest"

[bootstrap.repos]
"~/.dotfiles" = { url = "https://github.com/vicrdguez/dotfiles.git", ref = "main" }

# macOS preferences: apply with mise bootstrap --only macos-defaults
[bootstrap.macos.dock]
autohide = true
mru_spaces = false

[bootstrap.macos.defaults."com.apple.dock"]
expose-animation-duration = 0.0

# Each display has separate Spaces; requires logging out and back in.
[bootstrap.macos.defaults."com.apple.spaces"]
spans-displays = false

[bootstrap.macos.finder]
show_all_files = true

[bootstrap.macos.defaults."com.apple.finder"]
AppleShowAllExtensions = true

[bootstrap.macos.defaults.NSGlobalDomain]
AppleShowAllExtensions = true
AppleInterfaceStyle = "Dark"
NSUseAnimatedFocusRing = false
NSWindowShouldDragOnGesture = true

# macOS may require enabling this manually in Accessibility > Display.
[bootstrap.macos.defaults."com.apple.universalaccess"]
reduceMotion = true

# Caps Lock -> Control is configured manually in System Settings.
[bootstrap.macos.keyboard]
initial_key_repeat = 14
key_repeat = 1
press_and_hold = false

[dotfiles]
"~/.config/aerospace" = {}
"~/.config/fish" = {}
"~/.config/starship.toml" = {}
"~/.config/git/config" = {}
# clean copy to avoid auto-hooks
"~/.config/git/myconfig" = { source = "~/.dotfiles/.config/git/config", mode = "copy"}
"~/.config/mise" = {}
"~/.config/nvim" = {}
"~/.config/ghostty" = {}
"~/.config/zellij" = {}
"~/.config/herdr" = { mode = "symlink-each"}
"~/.local/bin/devserver-ssh-connect" = { mode = "copy" }
"~/.ssh/config.d/devserver.conf" = { mode = "copy" }
"~/.config/wezterm" = {}
"~/.pi/agent/settings.json" = {}
"~/.pi/agent/prompts" = { mode = "symlink-each" }
"~/.pi/agent/extensions" = { mode = "symlink-each" }
# Keep skill directories real so skl installs remain machine-local.
"~/.pi/agent/skills" = { mode = "symlink-each" }
"~/.agents/skills" = { mode = "symlink-each" }

[shell_alias]
# Mise command is too long
dot = "mise bootstrap dotfiles"
miseconf = "nvim ~/.config/mise/config.toml"
zl = "zellij"
# dotfiles = "cd ~/dev/toolbox/dotfiles"

[tools]
node = "lts"
gh = "latest"
neovim = "nightly"
tree-sitter = "latest"
uv = "latest"
starship = "latest"
fzf = "latest"
zellij = "latest"
pi = "latest"
direnv = "latest"
eza = "latest"
zoxide = "latest"
herdr = "latest"
lazygit = "latest"
"github:agavra/tuicr" = "latest"
opencode = "latest"
"npm:typescript-language-server" = "latest"

[env]
OPENCODE_DISABLE_CLAUDE_CODE = "1"
OPENCODE_DISABLE_LSP_DOWNLOAD = "true"
GIT_CONFIG_GLOBAL = "{{ env.HOME }}/.config/git/cleanconfig"
#
# # newest with this prefix (typically exact matches don't use the prefix)
# go = 'prefix:1.16'
#
# # multiple versions will all go into PATH in the order specified
# # this is helpful for making `python311` and `python310` available
# # even when `python` and `python3` point to a different version
# python = ['3.12', '3.11', '3.10']
#
# # some plugins can take options like python's virtualenv activation
# # with these, mise will automatically setup and activate vevs when entering
# # the project directory
# python = {version='3.12', virtualenv='.venv'}
# poetry = {version='1.7.1', pyproject='pyproject.toml'}
#
# [plugins]
# # specify a custom repo url so you can install with `mise plugin add <name>`
# # note this will only be used if the plugin is not already installed
# python = 'https://github.com/asdf-community/asdf-python'
#
# [alias.node.versions]
# # setup a custom alias so you can run `mise use -g node@work` for node-16.x
# work = '16'

