[settings]
dotfiles.root = "~/.dotfiles"

[bootstrap.packages]
"brew:fish" = "latest"
"brew:markdown-oxide" = "latest"

[bootstrap.repos]
"~/.dotfiles" = { url = "https://github.com/vicrdguez/dotfiles.git", ref = "main" }

[dotfiles]
"~/.config/aerospace" = {}
"~/.config/fish" = {}
"~/.config/starship.toml" = {}
"~/.config/git" = {}
# clean copy to avoid auto-hooks
"~/.config/git/myconfig" = { source = "~/.dotfiles/.config/git/config", mode = "copy"}
"~/.config/mise" = {}
"~/.config/nvim" = {}
"~/.config/ghostty" = {}
"~/.config/zellij" = {}
"~/.config/herdr" = { mode = "symlink-each"}
"~/.config/wezterm" = {}

[shell_alias]
# Mise command is too long
dot = "mise bootstrap dotfiles"
miseconf = "nvim ~/.config/mise/config.toml"
zl = "zellij"
# dotfiles = "cd ~/dev/toolbox/dotfiles"

[tools]
gh = "latest"
neovim = "nightly"
tree-sitter = "latest"
uv = "latest"
starship = "latest"
fzf = "latest"
zellij = "latest"
pi = "latest"
direnv = "latest"
eza = "latest"
zoxide = "latest"
herdr = "latest"
lazygit = "latest"
"github:agavra/tuicr" = "latest"
opencode = "latest"
"npm:typescript-language-server" = "latest"

[env]
OPENCODE_DISABLE_CLAUDE_CODE = "1"
OPENCODE_DISABLE_LSP_DOWNLOAD = "true"
#
# # newest with this prefix (typically exact matches don't use the prefix)
# go = 'prefix:1.16'
#
# # multiple versions will all go into PATH in the order specified
# # this is helpful for making `python311` and `python310` available
# # even when `python` and `python3` point to a different version
# python = ['3.12', '3.11', '3.10']
#
# # some plugins can take options like python's virtualenv activation
# # with these, mise will automatically setup and activate vevs when entering
# # the project directory
# python = {version='3.12', virtualenv='.venv'}
# poetry = {version='1.7.1', pyproject='pyproject.toml'}
#
# [plugins]
# # specify a custom repo url so you can install with `mise plugin add <name>`
# # note this will only be used if the plugin is not already installed
# python = 'https://github.com/asdf-community/asdf-python'
#
# [alias.node.versions]
# # setup a custom alias so you can run `mise use -g node@work` for node-16.x
# work = '16'

